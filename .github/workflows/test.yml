# Runs the harness tests (`make test`: fake `claude`, no tokens) on every pull request and push to
# main. Evals (`make eval*`) and `make live-smoke` call the real model, so they stay manual.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is the oldest Python supported; setup-python has no build of it for Ubuntu 26.04
          # (ubuntu-latest), so that one leg stays on 24.04.
          - {os: ubuntu-24.04, python: "3.9"}
          - {os: ubuntu-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      # The browser tests skip without Chrome, so CI would pass without running them. Both
      # runner images ship Chrome; fail here if that ever stops being true.
      - name: Chrome is installed
        run: python3 skills/orchestrate/scripts/ui_review.py chrome
      # Without a working bwrap the jail tests skip and workers would run unconfined: make it work,
      # then fail here if it doesn't.
      - name: Bubblewrap works
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0 || true
          python3 -c "import sys; sys.path.insert(0, 'skills/orchestrate/scripts'); import jail; sys.exit(jail.available())"
      - run: make test
